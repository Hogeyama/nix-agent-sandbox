name: Release strait

# strait is released separately from nas. To release:
#   1. set contrib/strait/VERSION and add a matching "## [X.Y.Z]" section to
#      contrib/strait/CHANGELOG.md
#   2. commit, then push the tag strait-vX.Y.Z
# The bundle carries Bun and glibc, so each architecture ships with its
# notices and corresponding-source materials as one verified set, like nas.
# Releases are created with --latest=false so /releases/latest keeps pointing
# at nas. The same set is also uploaded under version-free names to the
# rolling "strait-latest" release, whose download URL the README uses.

on:
  push:
    tags:
      - "strait-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag, VERSION and changelog agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\n' < contrib/strait/VERSION)"
          if [ "strait-v${version}" != "$TAG" ]; then
            echo "::error::tag $TAG does not match contrib/strait/VERSION ($version)"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" contrib/strait/CHANGELOG.md; then
            echo "::error::contrib/strait/CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@b66b36319cc6fde4ea85edd583b088c65d6b8710
      - uses: DeterminateSystems/magic-nix-cache-action@1828eb4e5414b8dfe36daae53ea3e4b8c3fdec7a

      - name: Build bundle and corresponding materials
        run: |
          nix build .#strait-bundled --out-link result-strait --print-build-logs
          nix build .#strait-release-inputs --out-link result-release-inputs --print-build-logs

      - name: Check the bundle reports the release version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          actual="$(./result-strait --version)"
          if [ "$actual" != "strait ${VERSION}" ]; then
            echo "::error::strait --version printed '$actual', expected 'strait ${VERSION}'"
            exit 1
          fi

      - name: Stage artifacts and inspect the extracted payload
        env:
          TAG: ${{ github.ref_name }}
          SYSTEM: ${{ matrix.system }}
        run: |
          nix develop -c bun scripts/release.ts prepare --product strait \
            --inputs result-release-inputs --binary "$(realpath result-strait)" \
            --out ".release/$SYSTEM" --tag "$TAG"

      - name: Exercise extraction and library replacement on the bundle being released
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix develop -c bash scripts/release/check_strait_bundle.sh \
            ".release/$SYSTEM/binary/strait" ".release/$SYSTEM/bundle-check.txt"

      - name: Check staged materials and archives
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix develop -c bun scripts/release.ts verify --stage ".release/$SYSTEM"

      - name: Hash the verified publication set
        env:
          TAG: ${{ github.ref_name }}
          SYSTEM: ${{ matrix.system }}
        run: |
          cd ".release/$SYSTEM"
          sha256sum "${TAG}_${SYSTEM}.tar.gz" \
            "${TAG}_${SYSTEM}-sources.tar.gz" \
            "${TAG}_${SYSTEM}-components.json" > "${TAG}_${SYSTEM}-sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}_${{ matrix.system }}
          if-no-files-found: error
          compression-level: 0
          path: |
            .release/${{ matrix.system }}/strait-v*.tar.gz
            .release/${{ matrix.system }}/strait-v*-components.json
            .release/${{ matrix.system }}/strait-v*-sha256.txt

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@b66b36319cc6fde4ea85edd583b088c65d6b8710
      - uses: DeterminateSystems/magic-nix-cache-action@1828eb4e5414b8dfe36daae53ea3e4b8c3fdec7a
      - uses: actions/download-artifact@v4
        with:
          pattern: release-${{ github.ref_name }}_*
          merge-multiple: true
          path: .release/publish

      - name: Upload the complete set to a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' contrib/strait/CHANGELOG.md > notes.md
          nix develop -c bun scripts/release/publish.ts --product strait \
            --directory .release/publish --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "strait ${VERSION}" --notes-file notes.md --not-latest

      - name: Update the rolling strait-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Version-free names, so the README's download URL never changes.
          mkdir rolling
          for system in x86_64-linux aarch64-linux; do
            for suffix in .tar.gz -sources.tar.gz -components.json; do
              cp ".release/publish/${TAG}_${system}${suffix}" "rolling/strait_${system}${suffix}"
            done
          done
          (cd rolling && sha256sum strait_* > strait-sha256.txt)
          title="strait latest (${VERSION})"
          notes="Always the newest strait release, currently ${VERSION}. Use the ${TAG} release to pin this version."
          if gh release view strait-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload strait-latest --repo "$GITHUB_REPOSITORY" --clobber rolling/*
            gh release edit strait-latest --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            # Keep the tag on the commit the assets were built from, so it never
            # holds on to an older or rewritten commit.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/strait-latest" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create strait-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest=false \
              rolling/*
          fi
