name: Test

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@b66b36319cc6fde4ea85edd583b088c65d6b8710 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@1828eb4e5414b8dfe36daae53ea3e4b8c3fdec7a # v13

      - name: Install dependencies
        run: |
          nix develop -c bun install --frozen-lockfile
          nix develop -c bun run vendor

      - name: Documentation checks
        run: |
          nix develop -c bun run docs:check
          nix develop -c bun run docs:build
          nix develop -c python3 docs-site/editorial/check-pkl.py

      # check runs every lint:* script before tsc.
      - name: Lint and type check
        run: nix develop -c bun run check

      # docker:dind-rootless needs unprivileged user namespaces; Ubuntu 24.04
      # runners restrict them via AppArmor (rootlesskit dies with
      # "fork/exec /proc/self/exe: operation not permitted"). Drop the
      # restriction on this throwaway VM so the DinD integration tests can
      # run; environments without the sysctl keep working because the tests
      # probe for the capability and skip.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Tests
        run: nix develop -c bun run test
