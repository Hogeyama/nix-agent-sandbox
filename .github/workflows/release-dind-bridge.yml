name: Release dind-bridge

# dind-bridge is released separately from nas. To release:
#   1. set contrib/dind-bridge/VERSION and add a matching "## [X.Y.Z]" section
#      to contrib/dind-bridge/CHANGELOG.md
#   2. commit, then push the tag dind-bridge-vX.Y.Z
# Releases are created with --latest=false so /releases/latest keeps pointing
# at nas. The same file is also uploaded to the rolling "dind-bridge-latest"
# release. The bundle runs on Node.js, so one file serves every platform.

on:
  push:
    tags:
      - "dind-bridge-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag, VERSION and changelog agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\n' < contrib/dind-bridge/VERSION)"
          if [ "dind-bridge-v${version}" != "$TAG" ]; then
            echo "::error::tag $TAG does not match contrib/dind-bridge/VERSION ($version)"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" contrib/dind-bridge/CHANGELOG.md; then
            echo "::error::contrib/dind-bridge/CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@b66b36319cc6fde4ea85edd583b088c65d6b8710

      - uses: DeterminateSystems/magic-nix-cache-action@1828eb4e5414b8dfe36daae53ea3e4b8c3fdec7a

      - name: Build and test the bundle
        run: |
          nix develop -c bun install --frozen-lockfile
          nix develop -c bun run test:dind-bridge-unit
          nix develop -c bun contrib/dind-bridge/build.ts --outfile dind-bridge

      - name: Check the bundle reports the release version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          actual="$(nix develop -c node dind-bridge --version)"
          if [ "$actual" != "dind-bridge ${VERSION}" ]; then
            echo "::error::dind-bridge --version printed '$actual', expected 'dind-bridge ${VERSION}'"
            exit 1
          fi

      - name: Write the checksum
        run: sha256sum dind-bridge > dind-bridge.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dind-bridge-${{ github.ref_name }}
          path: |
            dind-bridge
            dind-bridge.sha256

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' contrib/dind-bridge/CHANGELOG.md > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dind-bridge ${VERSION}" \
            --notes-file notes.md \
            --latest=false \
            dind-bridge dind-bridge.sha256

      - name: Update the rolling dind-bridge-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          title="dind-bridge latest (${VERSION})"
          notes="Always the newest dind-bridge release, currently ${VERSION}. Use the ${TAG} release to pin this version."
          if gh release view dind-bridge-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dind-bridge-latest --repo "$GITHUB_REPOSITORY" --clobber \
              dind-bridge dind-bridge.sha256
            gh release edit dind-bridge-latest --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            # Keep the tag on the commit the assets were built from, so it never
            # holds on to an older or rewritten commit.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dind-bridge-latest" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create dind-bridge-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest=false \
              dind-bridge dind-bridge.sha256
          fi
